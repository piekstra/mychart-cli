name: release

# Cut a release by pushing a tag like `v0.1.0`. Release builds live here
# rather than in per-push CI. One macOS job (Apple Silicon, which
# cross-compiles the Intel target) and one Linux job, independent
# (fail-fast: false); only `publish` attaches, and re-running a failed job
# finishes the draft it leaves.
#
# Only `publish`, which runs on a tag alone and runs no third-party build
# code, can write to the repository; building happens with a read-only token
# that checkout does not persist.
#
# The tag must match Cargo.toml's version, or nothing is built. `publish`
# attaches whatever was built to a draft and publishes it only once every
# expected asset is there, so `self-update` keeps finding the last whole
# release.
#
# A pull request that changes how releases are built, or the dependencies and
# version (Cargo.toml, Cargo.lock), runs every job but `publish` as a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On a tag, the tag must be the crate's version, or self-update would see
  # one version and run another.
  versions:
    name: check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag and Cargo.toml agree
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Asset names are the contract `mychart self-update` resolves against:
      # <bin>-<target>.tar.gz plus a sibling .sha256.
      - name: Build and package each target
        run: |
          set -euo pipefail
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked --target "$t"
            tar -C "target/$t/release" -czf "mychart-$t.tar.gz" mychart
            sha256 "mychart-$t.tar.gz" > "mychart-$t.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            mychart-*.tar.gz
            mychart-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  # Attaches whatever was built to a draft, even when one OS failed, so a dead
  # macOS queue still leaves the Linux tarball there. Publishes the
  # draft only when nothing expected is missing, and otherwise fails. Never runs
  # when the versions disagree.
  publish:
    name: publish the release
    needs: [versions, build]
    if: ${{ !cancelled() && needs.versions.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/mychart-*.tar.gz
            dist/mychart-*.tar.gz.sha256
          generate_release_notes: true
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "mychart-$t.tar.gz" "mychart-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of an older tag must not move Latest back to it.
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)
          latest=false; [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
